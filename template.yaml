      (a) An example of a low-entropy object (toilet), where contextual rooms provide distinctive guidance while contextual objects do not. 
      (b) An example of a high-entropy object (TV), where the unified map is more strongly influenced by local contextual objects due to the lack of distinctive spatial evidence from contextual rooms.

