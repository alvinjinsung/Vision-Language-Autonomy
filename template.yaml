teaser: VLA_teaser.png
abstract: |
  We developed a ***Vision-Language-Autonomy framework*** capable of taking in natural language queries or commands about a scene and generate the appropriate navigation-based response through reasoning about semantic and spatial relationships.
  Our framework works in a initially unknown environment and navigate to appropriate viewpoints to discover and validate spatial relations and attributes.
  Our system is equipped with a 3D LiDAR and a 360 camera, along with autonomy system capable of estimating sensor pose, analyze the terrain, avoid collisions, and navigate to waypoints.

  Our system is composed of four main components:
  - ***Perception Module***: Robust object detection and tracking using 3D LiDAR and 360 camera.
  - ***3D Scene Graph Module***: Building a hierarchical 3D scene graph using the detected objects.
  - ***Object-Goal Navigation Module***: Navigating to the goal object using the sensor input and natural language query.
  - ***Visual Grounding Module***: Grounding the language query to the given 3D environment and resoning to generate the appropriate navigation-based response.

  Integrated Vision-Language-Autonomy framework can reason about three types of questions:
  - ***Numerical questions***: "How many chairs are there between the table and the sofa?"
  - ***Object reference questions***: "Find the potted plant closest to the table."
  - ***Instruction-following questions***: "Please go to the kitchen avoiding the path between the fridge and the oven."

body:
  - title: Method
    text: |
      <div class="uk-grid-small uk-child-width-expand" uk-grid>
        <div>
          <img class="uk-align-center" src="VLA_framework.png">
        </div>
      </div>

      ### Perception Module

      <div class="uk-grid-small uk-child-width-xlarge" uk-grid>
        <div>
          <img class="uk-align-center" src="VLA_perception.png">
        </div>
      </div>

      We use *YOLO-World for object detection* and tracking.
      3D LiDAR points are projected into 2D images and 2D images are masked with SAM mask.
      With class labels verified using YOLO-World and SAM masks, we project point clouds back to 3D space with class labels and CLIP features.

      ### 3D Scene Graph Module

      <div class="uk-grid-small uk-child-width-expand" uk-grid>
        <div>
          <video src="VLA_sg.mp4" loop muted uk-video="autoplay:inview" />
        </div>
      </div>

      <div class="uk-grid-small uk-child-width-expand" uk-grid>
        <div>
          <img class="uk-align-center" src="VLA_sg_new.png">
        </div>
      </div>

      We build a *hierarchical 3D scene graph* using the detected objects.
      The layers consists of detection, object, keyframe, place, room, and scene.
      Object layer contains the detected objects that are registered with their 3D bounding boxes.
      Detection layer contains the detected objects that are not registered with their 3D bounding boxes.
      Keyframe layer contains the keyframes that are registered using following rules:
      - If the pose difference between the current frame and the previous frame is greater than a threshold, the current frame is registered as a keyframe.
      - If the new object is detected, the current frame is registered as a keyframe.
      - If the new detection is found, the current frame is registered as a keyframe.

      ### Object-Goal Navigation Module

      <div class="uk-grid-small uk-child-width-expand" uk-grid>
        <div>
          <img class="uk-align-center" src="VLA_exploration.png">
        </div>
      </div>

      We developed a *exploration strategy* that guides the agent to explore the environment in a way that is efficient and effective in finding the goal object.
      We use three types of exploration strategies:
      - *Geometric frontier-based exploration*: Navigates to the geometrically closest frontier.
      - *Semantic frontier-based exploration*: Navigates to the semantically closest frontier using CLIP embedded semantic value map.
      - *Contour-based exploration*: Navigates along the contour of the environment for thorough area coverage.

      <div class="uk-grid-small uk-child-width-1-2 uk-child-width-1-3@m" uk-grid>
        <div>
            <div>
              <video src="VLA_exploration_geometric.mp4" loop muted uk-video="autoplay:inview" />
            </div>
            <span class="uk-text-meta">Geometric frontier-based exploration</figcaption>
        </div>
        <div>
            <div>
              <video src="VLA_exploration_semantic.mp4" loop muted uk-video="autoplay:inview" />
            </div>
            <span class="uk-text-meta">Semantic frontier-based exploration</figcaption>
        </div>
        <div>
            <div>
              <img src="VLA_exploration_coverage.png" />
            </div>
            <span class="uk-text-meta">Countour-based exploration</figcaption>
        </div>
      </div>

      ### Visual Grounding Module

      <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m" uk-grid>
        <div>
            <div>
              <img src="VLA_vg_find.png" />
            </div>
            <span class="uk-text-meta">Find task reasoning flow</figcaption>
        </div>
        <div>
            <div>
              <img src="VLA_vg_count.png" />
            </div>
            <span class="uk-text-meta">Numerical task reasoning flow</figcaption>
        </div>
      </div>

      <div class="uk-grid-small uk-child-width-1-1 uk-child-width-1-2@m" uk-grid>
        <div>
            <div>
              <img src="VLA_vg_multiview.png" />
            </div>
            <span class="uk-text-meta">Multiview observation</figcaption>
        </div>
        <div>
            <div>
              <img src="VLA_vg_confidence.png" />
            </div>
            <span class="uk-text-meta">Confidence aggregation</figcaption>
        </div>
      </div>

      We utilize *VLM to reason about the language query and the 3D environment*.
      For each related object detection, the agent performs *multiview observation* using object-hull. After observing multiple views for each group, visual grounding module performs reasoning.
      We use multiple VLM models in parallel and aggregate the results for better reasoning.
      *Confidence aggregation based on entropy* is used to determine the most confident answer for the question.
      The module outputs the answer with the answer candidate which confidence is higher than a threshold.

  - title: Demonstration
    text: |
      Our framework successfully reason about the language query of the unknown 3D environment.

      <div class="uk-slider" uk-slider="draggable: false">
        <div class="uk-slider-items uk-child-width-expand" uk-grid>
          <div>
